[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.82"
description = "Lantern Babel Codex Bridge: an auditable evidence/belief kernel with contradiction tracking and an inter-instance exchange protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [
    { name = "Lantern project" },
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
